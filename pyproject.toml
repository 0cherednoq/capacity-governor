[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capacity-governor"
version = "0.1.0"
description = "Capacity allocation and replenishment policies for scarce resources: max-min fair sharing, sequential drain and (s, S) reordering."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0cherednoq" }]
keywords = [
  "asyncio",
  "capacity",
  "fair-share",
  "max-min-fair",
  "rate-limiting",
  "inventory",
  "postgresql",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/0cherednoq/capacity-governor"
Repository = "https://github.com/0cherednoq/capacity-governor"
Changelog = "https://github.com/0cherednoq/capacity-governor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Ядру (`capacity/`) зависимости не нужны ни одной — это условие гейта G0 и оно
# проверяется тестом. Всё, что ниже, нужно только адаптерам и разработке.
postgres = ["sqlalchemy>=2"]
# Адаптеры к Tallyho и Identity Hub написаны против публичных сигнатур и этих пакетов
# не импортируют, поэтому extras здесь — объявление совместимости для проекта, который
# ставит и то и другое вместе.
tallyho = ["tallyho>=0.0.1"]
identity-hub = ["identity-hub>=1.0.0a4"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "simpy>=4.1",
    "sqlalchemy>=2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capacity", "src/capacity_adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests", "sim"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "A", "B", "UP", "SIM", "RUF", "PL", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Сборка такта принимает все свои входы явно и только по имени — это её смысл.
"src/capacity/governor.py" = ["PLR0913"]
"tests/*" = ["PLR2004", "PLR0913", "PLR0917"]
"sim/*" = ["PLR2004", "PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "sim", "tests"]
