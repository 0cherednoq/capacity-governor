name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check .
      - run: mypy src tests sim
      # Политики чистые, seed фиксирован — прогоны симуляции детерминированы (G8).
      - run: pytest -q
